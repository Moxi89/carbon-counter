<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live CO₂ counter widget | Carbon Emissions Counter</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.carbonemissionscounter.com/">
    <style>
        @font-face { font-family: 'Fira Sans'; font-weight: 500; font-display: swap; src: url('/fonts/fira-sans-latin-500-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Fira Code'; font-weight: 300 700; font-display: swap; src: url('/fonts/fira-code-latin-wght-normal.woff2') format('woff2-variations'); }
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 20px;
            font-family: 'Fira Sans', system-ui, sans-serif;
            color: #ecfdf5;
            background: radial-gradient(120% 120% at 100% 0%, rgba(16, 185, 129, 0.22), transparent 60%), #06100c;
            overflow: hidden;
        }
        body.light { color: #052e22; background: radial-gradient(120% 120% at 100% 0%, rgba(16, 185, 129, 0.16), transparent 60%), #f4fbf8; }
        .label { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #a3bfb4; }
        .light .label { color: #3b6656; }
        .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); animation: pulse 2s ease-out infinite; }
        @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
        .num { margin: 6px 0 2px; font-family: 'Fira Code', ui-monospace, monospace; font-weight: 600; font-size: clamp(22px, 9vw, 44px); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; color: #34d399; }
        .light .num { color: #047857; }
        .sub { font-size: 13px; color: #a3bfb4; }
        .light .sub { color: #3b6656; }
        .credit { margin-top: 10px; font-size: 12px; }
        .credit a { color: #34d399; text-decoration: none; }
        .light .credit a { color: #047857; }
        .credit a:hover { text-decoration: underline; }
        @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
</head>
<body>
    <p class="label"><span class="dot" aria-hidden="true"></span><span>CO&#8322; emitted worldwide in <span id="y">2026</span></span></p>
    <p class="num" id="n" aria-live="off">0</p>
    <p class="sub">tonnes so far &middot; about 1,338 every second</p>
    <p class="credit"><a href="https://www.carbonemissionscounter.com/" target="_blank" rel="noopener">Live estimate by carbonemissionscounter.com</a></p>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            if (params.get('theme') === 'light') document.body.className = 'light';
            var PER_SECOND = 42.2e9 / (365 * 24 * 3600);
            var el = document.getElementById('n');
            var fmt = new Intl.NumberFormat('en-US');
            var now = new Date();
            document.getElementById('y').textContent = now.getFullYear();
            var slow = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            function tick() {
                var t = new Date();
                var start = new Date(t.getFullYear(), 0, 1).getTime();
                el.textContent = fmt.format(Math.floor((t - start) / 1000 * PER_SECOND));
            }
            tick();
            setInterval(tick, slow ? 1000 : 100);
        })();
    </script>
</body>
</html>
